author_analysis_contract:
  source_struct: xCsplitGal4
  interpolated_rate_hz: 10
  epoch_anchor: luminance_decrement
  epoch_period_seconds: 10.0
  extracted_epoch_seconds: 13.0
  normalization: whole_recording_mean_delta_F_over_F
  roi_exclusions: [all_zero, any_NaN]
  roi_selection: positive_correlation_with_mean_stimulus
  aggregation_order: repetitions_then_ROIs_within_fly_then_flies
comparison_contract:
  permitted_external_input_cell_types: [R1, R2, R3, R4, R5, R6]
  excluded_flyvis_input_cell_types: [R7, R8]
  stimulus:
    dynamic_range: [0.0, 1.0]
    radius: -1
    alternations: [0, 1, 0]
    baseline_seconds: 5.0
    ON_seconds: 5.0
    post_seconds_available: 3.0
  baseline_window_seconds: [-1.0, 0.0]
  onset_peak_window_seconds: [0.0, 1.0]
  late_plateau_window_seconds: [4.0, 5.0]
  recovery_window_seconds: [7.0, 8.0]
  waveform_window_seconds: [-1.0, 8.0]
  interval_semantics: left_closed_right_open
  model_sample_intervals_seconds: [0.005, 0.02]
  comparison_rate_hz: 10
  calcium_forward_time_constants_seconds: [0.2, 0.25, 0.3, 0.35]
  inherited_minimum_correlation: 0.8
  inherited_threshold_evidence: configs/driving-v7-c3-analytic-filter-precheck.yaml
  require_every_model_cross_dt_correlation: true
  require_every_model_leave_one_model_out_correlation: true
  require_every_calcium_assumption_external_correlation: true
  external_feature_interval: empirical_fly_2.5_to_97.5_percentile
  no_threshold_selection_after_model_observation: true
flyvis_official_timing_sensitivity_contract:
  stimulus:
    dynamic_range: [0.0, 1.0]
    radius: -1
    alternations: [0, 1, 0]
    baseline_seconds: 1.0
    ON_seconds: 1.0
    post_seconds: 1.0
  model_sample_intervals_seconds: [0.005, 0.02]
  exact_native_FlyVis_input_reproduction: false
  reason: native_FlyVis_video_input_also_targets_R7_R8_but_v7_permits_only_R1_R6
boundary:
  preregistered_before_ensemble_generation: true
  author_code_does_not_define_peak_plateau_or_recovery_thresholds: true
  empirical_intervals_are_descriptive_not_author_thresholds: true
  calcium_trace_is_not_membrane_voltage: true
