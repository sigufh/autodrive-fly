  polarity_response: maximum_signed_baseline_subtracted_response
  looming_comparator: elementwise_max_of_receding_and_same_size_static
  contrast_formula: (preferred-comparator)/(abs(preferred)+abs(comparator))
execution_order:
  development: always
  validation: after_development_pass
  ood: after_validation_pass
  final: after_all_stage1_and_topology_gates_and_external_custody
boundary:
  model_evaluated: false
