version: 1
name: v7-t5-direct-source-axis-audit
observed_on: "2026-09-17"
lamina_split_evidence: artifacts/v7-t5-lamina-split.json
lamina_split_protocol: configs/driving-v7-t5-lamina-split.yaml
scoring_config: configs/driving-v7-stage1-scoring.yaml
optic_hex_axis_evidence: artifacts/v7-optic-hex-axis-calibration.json
source_groups:
  fast: [Tm1, Tm2, Tm4]
  delayed: [Tm9]
axis_definition: delayed_weighted_centroid_minus_fast_weighted_centroid
coordinate_convention: optic_hex_to_image_xy_with_left_eye_horizontal_reflection
thresholds:
  minimum_axis_norm: 0.000000000001
  minimum_valid_cell_fraction: 0.80
  minimum_median_expected_cosine: 0.10
  minimum_positive_alignment_fraction: 0.60
  maximum_population_mirror_axis_error: 0.20
gate:
  require_every_population: true
  require_all_mirror_pairs: true
boundary:
  structure_only: true
  all_T5_cells_in_denominator: true
  source_axis_uses_labels: false
  labels_used_for_posthoc_scoring_only: true
  transform_fit: false
  sign_search: false
  parameter_fit: false
  target_activity_injection: false
  calibration_evaluated: false
  runtime_modified: false
  connect_to_navigation: false
  fitted_transform_application_authorized: false
