version: 1
name: v7-t5-typed-spatial-pair-precheck
observed_on: "2026-09-18"
lamina_split_protocol: configs/driving-v7-t5-lamina-split.yaml
lamina_split_evidence: artifacts/v7-t5-lamina-split.json
prior_source_pair_evidence: artifacts/v7-t5-source-pair-precheck.json
prior_continuous_moment_evidence: artifacts/v7-t5-continuous-moment-precheck.json
stage1_protocol: configs/driving-v7-stage1-nested.yaml
scoring_config: configs/driving-v7-stage1-scoring.yaml
source_position_protocol: configs/driving-v7-lplc2-radial-opponency.yaml
condition_id: S1-T01
source_roles:
  fast_sources: [Tm1, Tm2, Tm4]
  delayed_excitation: Tm9
  inhibitory_modulator_kept_separate: CT1
  horizontal_pair: [Tm2, Tm9]
  vertical_pair: [Tm9, Tm1]
mechanism:
  source_activity: positive_baseline_subtracted_state
  horizontal_formula: antisymmetric_spatiotemporal_moment(Tm2,Tm9,x)
  vertical_formula: antisymmetric_spatiotemporal_moment(Tm9,Tm1,y)
  projection_axis: [Tm2_centroid_x_minus_Tm9_centroid_x, Tm9_centroid_y_minus_Tm1_centroid_y]
  normalization: sum_absolute_pair_terms_plus_1e-9
  temporal_reduction: positive_peak
  base: Tm9_positive_baseline_subtracted_source_peak
  additive_gains: [0.125, 0.5, 2.0, 8.0]
  position_reduction: target_RF_assignment_over_fixed_5x3_grid
stop_gate:
  minimum_bilateral_direction_subtypes_to_run_controls: 1
  require_all_direction_populations: true
  require_all_polarity_populations: true
  require_mirror: true
  maximum_mirror_error: 0.20
controls_after_ordered_gate: [temporal_shuffle, static_sham]
boundary:
  tuning_only: true
  single_condition_precheck: true
  source_pairs_selected_from_prior_anatomy_not_response_score: true
  projection_axis_uses_source_anatomy_not_subtype_labels: true
  dynamics_do_not_read_subtype_or_direction_labels: true
  labels_used_for_posthoc_scoring_only: true
  fixed_whole_population_denominators: true
  Tm1_Tm2_Tm4_remain_fast_sources: true
  Tm9_and_CT1_not_merged: true
  labels_changed: false
  thresholds_changed: false
  parameter_fit: false
  target_activity_injection: false
  calibration_evaluated: false
  final_evaluated: false
  runtime_modified: false
  connect_to_navigation: false
  LPLC_experiments_authorized_only_after_strict_T4_T5_gate: true
