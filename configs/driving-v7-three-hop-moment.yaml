version: 1
name: v7-three-hop-on-off-moment-reichardt
observed_on: "2026-09-17"
local_edge_config: configs/driving-v7-t4t5-local-edge-precheck.yaml
stage1_protocol: configs/driving-v7-stage1-nested.yaml
scoring_config: configs/driving-v7-stage1-scoring.yaml
condition_ids: [S1-T01, S1-T02, S1-T03]
retinal_backend: explicit_frame_difference_ON_OFF
path_length_edges: 3
known_final_sources:
  T4: [Mi1, Tm3, Mi4, C3, Mi9, CT1]
  T5: [Tm1, Tm2, Tm4, Tm9, CT1]
motion_energy:
  ON: max(current_luminance-previous_luminance, 0)
  OFF: max(previous_luminance-current_luminance, 0)
  formula: coordinate_moment_now*mass_previous-mass_now*coordinate_moment_previous
  normalization: sum_absolute_horizontal_and_vertical_terms_plus_1e-9
  position_pooling: maximum_over_same_fixed_5x3_grid
  subtype_labels_used_by_activity_generation: false
stimulus:
  family: local_moving_step_edge
  aperture_radius_pixels: 8.0
  common_background_level: 0.5
  common_background_frames: 2
  polarity_transition_per_pixel: exactly_once
  speed_source: stage1_generator_parameters.edge_speed_pixels_per_frame
controls:
  coordinate_shuffle_seed: 20260917
  direction_reversal: true
  temporal_shuffle_seed: 20260917
  temporal_and_static_sham_condition: S1-T01
  sequential_execution: [temporal_shuffle, static_sham, coordinate_shuffle, direction_reversal]
  stop_after_first_failed_control: true
thresholds:
  minimum_valid_denominator: 0.000001
  minimum_valid_cell_fraction: 0.80
  minimum_median_signed_contrast: 0.10
  minimum_positive_cell_fraction: 0.60
  minimum_joint_valid_fraction: 0.80
  minimum_all_condition_success_fraction: 0.60
  maximum_mirror_error: 0.20
advance_gate:
  require_all_16_direction_populations: true
  require_all_16_polarity_populations: true
  require_coordinate_shuffle_failure: true
  require_direction_reversal_failure: true
  require_temporal_shuffle_failure: true
boundary:
  tuning_only: true
  diagnostic_head_not_target_activity: true
  target_activity_injection: false
  parameter_fit: false
  calibration_evaluated: false
  runtime_modified: false
  connect_to_navigation: false
