[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "autodrive-fly"
version = "0.1.0"
description = "Doomfly-inspired MaleCNS visual obstacle driving and dopamine learning simulator"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "pyarrow>=18,<26",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "scipy>=1.14,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
autodrive-fly = "fly_emotion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fly_emotion", "apps/api/src/fly_emotion_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["apps/api/src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
